# フォーム営業撲滅AI — 経路A: Cloudflare Worker 設定
#
# デプロイ前にやること（SKILL.md Step 4）:
#   1. npx wrangler kv namespace create RECORDS  → 出力された id を下の kv_namespaces に貼る
#   2. npx wrangler secret put ANTHROPIC_API_KEY
#   3. npx wrangler secret put CORRECTION_SECRET   （openssl rand -hex 32 などで生成）
#   4. npx wrangler secret put SLACK_WEBHOOK_URL   （通知先。SPAM 専用は SLACK_WEBHOOK_SPAM・任意）
#   5. npx wrangler deploy

name = "form-sales-guard"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
# モデル ID は 1 箇所に集約（提供終了時はここだけ変える。docs/PITFALLS.md A-1）
MODEL = "claude-sonnet-5"
# 本番フォームのオリジン（例: "https://www.example.com"）。空なら全許可（テスト時のみ推奨）
ALLOWED_ORIGIN = ""
# デプロイ後の Worker の URL（修正リンクの生成に使う。例: "https://form-sales-guard.<account>.workers.dev"）
PUBLIC_URL = ""
# /test-form のテストフォームを有効にする。運用開始後は "false" に
TEST_FORM = "true"

[[kv_namespaces]]
binding = "RECORDS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
